name: Fare check

on:
  schedule:
    # 01:10 and 13:10 UTC = 09:10 and 21:10 Asia/Hong_Kong (no DST) — every 12h
    - cron: "10 1,13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fare-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Run the fare check
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
        run: npm run check

      - name: Commit updated prices
        run: |
          git config user.name "hkg-cts-fares-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data/prices.json; then
            echo "No price change to commit."
          else
            git add data/prices.json
            git commit -m "Daily fare check: $(date -u +%Y-%m-%d)"
            # Another commit (a manual re-run, a same-day retry) may have
            # landed on main since this job checked it out — rebase onto
            # whatever's latest before pushing, instead of failing outright.
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              echo "Push rejected (attempt $attempt/3) — fetching and rebasing onto origin/main..."
              git fetch origin main
              git rebase origin/main
            done
          fi
