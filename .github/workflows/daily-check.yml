name: Daily fare check

on:
  schedule:
    # 01:10 UTC = 09:10 Asia/Hong_Kong (no DST)
    - cron: "10 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-fare-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the fare check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: npm run check

      - name: Commit updated prices
        run: |
          git config user.name "hkg-cts-fares-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data/prices.json; then
            echo "No price change to commit."
          else
            git add data/prices.json
            git commit -m "Daily fare check: $(date -u +%Y-%m-%d)"
            git push
          fi
